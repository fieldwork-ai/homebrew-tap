name: formula

# The tap ships metadata only (download URLs, versions, checksums), so the one
# thing worth checking on every change is that the formula is well-formed and
# installable: `brew style` for syntax and conventions, `brew audit --strict`
# for the checksum, URL and licence fields. A broken formula here breaks
# `brew install fieldwork-ai/tap/lighter` for everyone.

on:
  pull_request:
    paths: ["Formula/**", ".github/workflows/formula.yml"]
  push:
    branches: [main]
    paths: ["Formula/**", ".github/workflows/formula.yml"]

jobs:
  audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tap this checkout
        run: |
          tap_dir="$(brew --repository)/Library/Taps/fieldwork-ai/homebrew-tap"
          mkdir -p "$(dirname "$tap_dir")"
          ln -s "$GITHUB_WORKSPACE" "$tap_dir"
      # The formula keeps `post_install` behind a RuboCop directive on purpose
      # (see the comment above it), and Homebrew's style config forbids the
      # directive itself; that one cop is excluded so the check reports real
      # problems rather than the exemption.
      - name: brew style
        run: brew style --except-cops Style/DisableCopsWithinSourceCodeDirective fieldwork-ai/tap
      - name: brew audit
        run: brew audit --strict --online --skip-style fieldwork-ai/tap/lighter
